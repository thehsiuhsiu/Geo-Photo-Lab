<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="定點照片">
  <title>定點照片</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 主畫面 -->
  <header class="navbar main-nav">
    <div class="nav-row">
      <span class="status" id="gpsStatus">定位中…</span>
      <div class="nav-actions">
        <button class="nav-icon" id="btnManage" aria-label="管理清單與定點"></button>
        <button class="nav-icon" id="btnSettings" aria-label="設定與備份"></button>
      </div>
    </div>
    <h1 class="large-title">定點照片</h1>
    <button class="trigger-pill" id="listBar"></button>
  </header>

  <div id="banners"></div>
  <main id="main" class="main"></main>

  <!-- 管理：清單與定點 -->
  <section class="sheet" id="manageSheet" hidden>
    <header class="sheet-nav">
      <span></span>
      <h2>管理</h2>
      <button class="nav-text bold" data-close>完成</button>
    </header>
    <div class="sheet-body" id="manageBody"></div>
  </section>

  <!-- 編輯定點 -->
  <section class="sheet" id="editSheet" hidden>
    <header class="sheet-nav">
      <button class="nav-text" id="editCancel">取消</button>
      <h2 id="editTitle">新增定點</h2>
      <button class="nav-text bold" id="editSave">儲存</button>
    </header>
    <form class="sheet-body" id="editForm" autocomplete="off">
      <div class="group">
        <label class="cell input-cell">
          <span class="cell-label">名稱</span>
          <input type="text" id="fName" maxlength="60" placeholder="例如：OO巡邏箱">
        </label>
        <label class="cell input-cell">
          <span class="cell-label">觸發半徑</span>
          <input type="number" id="fRadius" min="5" max="1000" step="1" inputmode="numeric">
          <span class="unit">公尺</span>
        </label>
      </div>

      <p class="group-title">位置</p>
      <div class="group">
        <div class="cell"><span class="coord" id="fCoord"></span></div>
        <button type="button" class="cell action-cell" id="fUseHere">改用目前位置</button>
        <button type="button" class="cell action-cell" id="fUseMap">在地圖上調整</button>
      </div>

      <p class="group-title">所屬清單</p>
      <div class="group" id="fLists"></div>
      <p class="group-foot">至少選一個。</p>

      <p class="group-title">備註</p>
      <div class="group">
        <textarea class="cell textarea-cell" id="fNote" rows="3" maxlength="1000" placeholder="例如：巡邏箱在巷子內側電線桿上"></textarea>
      </div>

      <p class="group-title">參考照片</p>
      <div class="photo-grid" id="fPhotos"></div>
      <p class="group-foot" id="fPhotoHint"></p>
      <input type="file" id="fFile" accept="image/*" multiple hidden>

      <div class="group" id="editDeleteGroup">
        <button type="button" class="cell action-cell danger center" id="editDelete">刪除定點</button>
      </div>
    </form>
  </section>

  <!-- 刪除清單 -->
  <section class="sheet" id="listDeleteSheet" hidden>
    <header class="sheet-nav">
      <button class="nav-text" id="ldCancel">取消</button>
      <h2>刪除清單</h2>
      <span></span>
    </header>
    <div class="sheet-body">
      <p class="lead" id="ldInfo"></p>
      <div class="group">
        <label class="cell choice-cell"><span>移到其他清單</span><input type="radio" name="ldMode" value="move" checked></label>
        <label class="cell choice-cell" id="ldTargetCell"><span class="sub">移到</span><select id="ldTarget"></select></label>
        <label class="cell choice-cell"><span class="danger-text">連同定點一起刪除</span><input type="radio" name="ldMode" value="delete"></label>
      </div>
      <div class="group">
        <button class="cell action-cell danger center" id="ldConfirm">刪除清單</button>
      </div>
    </div>
  </section>

  <!-- 地圖選點 -->
  <section class="sheet map-sheet" id="mapSheet" hidden>
    <header class="sheet-nav">
      <button class="nav-text" id="mapCancel">取消</button>
      <h2>選擇位置</h2>
      <button class="nav-text bold" id="mapConfirm">完成</button>
    </header>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="crosshair" aria-hidden="true"></div>
      <div class="map-tip">移動地圖，讓十字對準定點</div>
      <button class="map-locate" id="mapLocate" aria-label="回到我的位置"></button>
    </div>
  </section>

  <!-- 設定與備份 -->
  <section class="sheet" id="settingsSheet" hidden>
    <header class="sheet-nav">
      <span></span>
      <h2>設定</h2>
      <button class="nav-text bold" data-close>完成</button>
    </header>
    <div class="sheet-body">
      <div class="group">
        <label class="cell">
          <span>螢幕保持亮著</span>
          <input type="checkbox" class="switch" id="sWake">
        </label>
      </div>
      <p class="group-foot" id="sWakeHint">開著本 App 時螢幕不會自動鎖定，定位才不會中斷。</p>

      <p class="group-title">匯出備份</p>
      <form id="exportForm">
        <div class="group">
          <label class="cell input-cell"><span class="cell-label">密碼</span><input type="password" id="ePass1" minlength="4" autocomplete="new-password" placeholder="至少 4 個字"></label>
          <label class="cell input-cell"><span class="cell-label">再輸入</span><input type="password" id="ePass2" minlength="4" autocomplete="new-password" placeholder="確認密碼"></label>
          <button type="submit" class="cell action-cell" id="exportBtn">產生備份檔</button>
        </div>
      </form>
      <p class="group-foot">上次備份：<span id="sLastBackup">從未</span>。忘記密碼就無法還原。</p>
      <div id="exportResult" hidden>
        <div class="group">
          <div class="cell"><span class="sub" id="exportInfo"></span></div>
          <button class="cell action-cell" id="exportShare">儲存到「檔案」或分享</button>
          <a class="cell action-cell" id="exportDownload">下載</a>
        </div>
      </div>

      <p class="group-title">匯入備份</p>
      <form id="importForm">
        <div class="group">
          <label class="cell input-cell file-cell"><span class="cell-label">備份檔</span><span class="file-name" id="iFileName">選擇檔案</span><input type="file" id="iFile" hidden></label>
          <label class="cell input-cell"><span class="cell-label">密碼</span><input type="password" id="iPass" autocomplete="current-password" placeholder="備份時設的密碼"></label>
          <button type="submit" class="cell action-cell">匯入並合併</button>
        </div>
      </form>
      <p class="group-foot" id="importResult">會與手機現有的清單和定點合併，同一筆保留較新的那份。</p>

      <p class="group-foot center about">資料只存在這支手機，不會上傳。<br>地圖 © OpenStreetMap 貢獻者</p>
    </div>
  </section>

  <!-- 動作選單 -->
  <div class="action-sheet" id="actionSheet" hidden>
    <div class="action-panel">
      <div class="action-group" id="actionGroup"></div>
      <button class="action-btn cancel" id="actionCancel">取消</button>
    </div>
  </div>

  <!-- 輸入對話框 -->
  <div class="dialog" id="textDialog" hidden>
    <form class="dialog-box" id="textForm">
      <h3 id="textTitle"></h3>
      <input type="text" id="textInput" maxlength="30">
      <div class="dialog-actions">
        <button type="button" id="textCancel">取消</button>
        <button type="submit" class="bold">確定</button>
      </div>
    </form>
  </div>

  <!-- 看大圖 -->
  <div class="viewer" id="viewer" hidden>
    <img id="viewerImg" alt="">
    <button class="viewer-close" id="viewerClose" aria-label="關閉">✕</button>
    <button class="viewer-nav prev" id="viewerPrev" aria-label="上一張">‹</button>
    <button class="viewer-nav next" id="viewerNext" aria-label="下一張">›</button>
    <div class="viewer-count" id="viewerCount"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
